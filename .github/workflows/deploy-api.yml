name: Deploy LifeFlow API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/core/**'
      - '.github/workflows/deploy-api.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifeflow-api
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build API
        run: npm run build:api
      - name: Deploy Worker
        working-directory: apps/api
        run: npx wrangler deploy --config wrangler.toml
        env:
          # Configure these two repository secrets before relying on this
          # workflow. Local OAuth is intentionally not available in Actions.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
